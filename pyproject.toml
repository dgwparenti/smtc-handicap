[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smtc-handicap"
version = "0.1.0"
description = "Bayesian modelling for handicapping toboggan races on the Cresta Run"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "requests",
    "beautifulsoup4",
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smtc_handicap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring live Gmail API access (deselect with '-m not integration')",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
