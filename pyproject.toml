[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smtc-handicap"
version = "0.1.0"
description = "Bayesian modelling for handicapping toboggan races on the Cresta Run"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "requests",
    "beautifulsoup4",
    "lxml",
    "fpdf2",
    "pdfplumber",
    "cmdstanpy>=1.2",
    "numpy",
    "pandas",
    "arviz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
    "ruff",
    "httpx",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smtc_handicap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring live Gmail API access (deselect with '-m not integration')",
    "ui: tests requiring UI dependencies — plotly, scipy (deselect with '-m not ui')",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
